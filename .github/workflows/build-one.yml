name: build-one

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build'
        required: true
        default: 'pandas'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pull toolchain image from ghcr.io (fast, no artifact download)
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true
          if docker pull ghcr.io/${{ github.repository }}/toolchain:latest 2>/dev/null; then
            echo "IMAGE_TAG=ghcr.io/${{ github.repository }}/toolchain:latest" >> "$GITHUB_ENV"
            echo "TOOLCHAIN_READY=true" >> "$GITHUB_ENV"
            echo "Loaded toolchain image from ghcr.io"
          fi

      - name: Find latest toolchain artifact run-id
        if: env.TOOLCHAIN_READY != 'true'
        run: |
          JSON=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=toolchain-image&per_page=1")
          RUN_ID=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('artifacts',[{}])[0].get('workflow_run',{}).get('id','') or '')")
          if [ -n "$RUN_ID" ]; then
            echo "TOOLCHAIN_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
            echo "Found toolchain artifact from run $RUN_ID"
          fi

      - name: Download fallback artifact
        if: env.TOOLCHAIN_READY != 'true' && env.TOOLCHAIN_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: toolchain-image
          repository: ${{ github.repository }}
          run-id: ${{ env.TOOLCHAIN_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/

      - name: Load fallback image
        if: env.TOOLCHAIN_READY != 'true' && env.TOOLCHAIN_RUN_ID != ''
        run: |
          if [ -f /tmp/toolchain.tar.zst ] && [ -s /tmp/toolchain.tar.zst ]; then
            zstd -d -f /tmp/toolchain.tar.zst -o /tmp/toolchain.tar && \
            docker load -i /tmp/toolchain.tar
            echo "IMAGE_TAG=ghcr.io/${{ github.repository }}/toolchain:latest" >> "$GITHUB_ENV"
            echo "TOOLCHAIN_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Fallback base builder
        if: env.TOOLCHAIN_READY != 'true'
        run: |
          echo "IMAGE_TAG=ghcr.io/termux/package-builder:latest" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_READY=true" >> "$GITHUB_ENV"

      - name: Fetch upstream termux-packages
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/termux/termux-packages.git upstream
          cd upstream
          git sparse-checkout set packages scripts ndk-patches root-packages x11-packages
          mkdir -p root-packages x11-packages
          cp -r ../packages/* packages/

      - name: Build ${{ github.event.inputs.package }}
        run: |
          cd upstream
          export TERMUX_BUILDER_IMAGE_NAME="${IMAGE_TAG}"
          # pre-install python-numpy in the same container session, then build
          ./scripts/run-docker.sh bash -c "
            /data/data/com.termux/files/usr/bin/pkg install -y python-numpy &&
            ./build-package.sh -a aarch64 ${{ github.event.inputs.package }}
          "

      - name: Collect own deb
        run: |
          mkdir -p own-debs
          cp upstream/output/${{ github.event.inputs.package }}_*.deb own-debs/ 2>/dev/null || echo "no deb for ${{ github.event.inputs.package }}"
          ls -la own-debs/

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ github.event.inputs.package }}
          path: own-debs/*.deb
          if-no-files-found: warn
          retention-days: 14