name: build-termux-pkgs

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to build (comma separated)'
        required: false
        default: 'tiktoken,watchfiles,uvloop,httptools,asyncpg,psycopg2,pgvector,pandas'
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/**'

permissions:
  contents: read
  packages: write

env:
  PKG_LIST: tiktoken watchfiles uvloop httptools asyncpg psycopg2 pgvector

jobs:
  # Build the python toolchain (python + python-pip + full dep chain) once,
  # commit the builder container state, and publish it as an artifact.
  # Subsequent per-package jobs restore this image and only build their own
  # package — avoiding the ~17min python chain rebuild inside the runner's
  # ~21min lifetime.
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream termux-packages
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/termux/termux-packages.git upstream
          cd upstream
          git sparse-checkout set packages scripts ndk-patches root-packages x11-packages
          cp -r ../packages/* packages/

      - name: Build python toolchain (python + python-pip)
        run: |
          cd upstream
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 python python-pip

      - name: Set lowercase repo name for docker
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Commit and push toolchain image to ghcr.io
        run: |
          docker commit termux-package-builder ghcr.io/${{ env.REPO_LC }}/toolchain:latest
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ env.REPO_LC }}/toolchain:latest
          # also save as artifact for backward compatibility (build-one fallback)
          docker save ghcr.io/${{ github.repository }}/toolchain:latest | zstd -T0 -3 -o /tmp/toolchain.tar.zst
          ls -la /tmp/toolchain.tar.zst

      - name: Upload toolchain image
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-image
          path: /tmp/toolchain.tar.zst
          retention-days: 3

  build:
    needs: warmup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [tiktoken, watchfiles, uvloop, httptools, asyncpg, psycopg2, pgvector, pandas]
    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain image
        uses: actions/download-artifact@v4
        with:
          name: toolchain-image
          path: /tmp/

      - name: Load toolchain image
        run: |
          zstd -d -f /tmp/toolchain.tar.zst -o /tmp/toolchain.tar
          docker load -i /tmp/toolchain.tar

      - name: Fetch upstream termux-packages
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/termux/termux-packages.git upstream
          cd upstream
          git sparse-checkout set packages scripts ndk-patches root-packages x11-packages
          cp -r ../packages/* packages/

      - name: Build ${{ matrix.package }}
        run: |
          cd upstream
          export TERMUX_BUILDER_IMAGE_NAME=ghcr.io/termux/package-builder:python-toolchain
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 ${{ matrix.package }}

      - name: Collect own deb
        run: |
          # copy only this package's deb (output/ also holds dependency-chain
          # debs like libcap-ng-static_2:0.9.3 — colon in filename breaks
          # upload-artifact)
          mkdir -p own-debs
          cp upstream/output/${PACKAGE}_*.deb own-debs/ 2>/dev/null || echo "no deb for ${PACKAGE}"
          ls -la own-debs/
        env:
          PACKAGE: ${{ matrix.package }}

      - name: Upload deb for ${{ matrix.package }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.package }}
          path: own-debs/*.deb
          if-no-files-found: warn
          retention-days: 14