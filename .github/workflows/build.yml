name: build-termux-pkgs

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to build (comma separated)'
        required: false
        default: 'tiktoken,watchfiles,uvloop,httptools,asyncpg,psycopg2,pgvector'
        # NOTE: greenlet deliberately excluded — a 'greenlet' deb would collide
        # with official python-greenlet files; compile greenlet==3.3.2 locally
        # via pip instead (pure C, minutes).
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream termux-packages (recipes + build scripts)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/termux/termux-packages.git upstream
          cd upstream
          git sparse-checkout set packages scripts ndk-patches root-packages x11-packages
          # overlay our custom recipes on top of upstream (overwrite/add)
          cp -r ../packages/* packages/

      - name: Build packages for aarch64
        run: |
          set -euo pipefail
          PKGS="${{ github.event.inputs.packages }}"
          : "${PKGS:=tiktoken,watchfiles,uvloop,httptools,asyncpg,psycopg2,pgvector}"
          PKGS=$(echo "$PKGS" | tr ',' ' ')
          echo "Building: $PKGS"
          cd upstream
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 $PKGS

      - name: List artifacts
        if: always()
        run: |
          echo "=== debs ==="
          ls -la upstream/debs/ 2>/dev/null || echo "(no debs directory)"

      - name: Upload debs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-aarch64-debs
          path: upstream/debs/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            upstream/debs/*.log
            **/*.log
          if-no-files-found: warn
          retention-days: 7