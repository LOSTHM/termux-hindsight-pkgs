name: build-termux-pkgs

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to build (comma separated)'
        required: false
        default: 'tiktoken,watchfiles,uvloop,httptools,asyncpg,psycopg2,pgvector'
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build packages for aarch64
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            PKGS="${{ github.event.inputs.packages }}"
          else
            PKGS="tiktoken,watchfiles,uvloop,httptools,asyncpg,psycopg2,pgvector"
          fi
          PKGS=$(echo "$PKGS" | tr ',' ' ')
          echo "Building: $PKGS"
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 $PKGS

      - name: List artifacts
        if: always()
        run: |
          echo "=== debs ==="
          ls -la debs/ 2>/dev/null || echo "(no debs directory)"
          echo "=== package dir ==="
          ls -la packages/*/  2>/dev/null | head -40

      - name: Upload debs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-aarch64-debs
          path: debs/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/.termux-build/**/*.log
            **/*.log
          if-no-files-found: warn
          retention-days: 7